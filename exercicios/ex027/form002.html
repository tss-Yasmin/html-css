<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>teste de formulario</h1>
  <form
   action="cadastro.php" method="post" autocomplete="on">
    <p>
      <label for="iusu">Usuário:</label>
    <input class="usuario" type="text" name="usu" id="iusu" required minlength="5" maxlength="30" size="10" placeholder="nome do usuario" autocomplete="username" >
    </p>

    <p>
      <label for="isen">Senha:</label>
      <input class="usuario" type="password" name="sen" id="isen" required minlength="8" size="10"  placeholder="minimo 8 letras" autocomplete="current-password" >
    </p>

    <p>
        <input class="usuario" type="submit" value="Enviar">
        <input class="usuario" type="reset" value="Limpar">
    </p>
  </form>
</body>
</html>
