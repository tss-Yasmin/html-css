<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>formulario</title>
</head>
<body>
  <h1>exemplo de formulario</h1>
  <form action="cadastro.php" method="get" autocomplete="on">

    <fieldset>
      <legend>Sexo</legend>
      <input type="radio" name="sexo" id="isxmas" value="m"> <label for="isxmas">Masculino</label>
      <input type="radio" name="sexo" id="isxfem" value="f"> <label for="isxfem">Feminino</label>
    </fieldset>

    <!-- todos os tipo radio precisam ter o mesmo name porem o id é diferente -->

    <fieldset>
      <legend>Esportes favoritos</legend>
      <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label>
      <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label>
      <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label>
      <input type="checkbox" name="esten" id="iesten"> <label for="iesten">Tênis</label>
    </fieldset>

    <p>
      <input type="submit" value="enviar">
      <input type="reset" value="limpar">
    </p>
  </form>
</body>
</html>
