<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midia em HTML5</title>
</head>
<body>
  <h1>
    imagem dinâmica
  </h1>
  <p>
    Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.
  </p>
  <picture>
    <source media="(max-width:750px)" srcset="img/foto-p.png" type="image/png">

    <source media="(max-width:1050px )" srcset="img/foto-m.png" type="image/png">

    <img src="img/foto-g.png" alt="imagem flexivel"
  </picture>
  <h1>
    Reproduzindo Áudio
  </h1>
  <p>
    Vamos aprender a reproduzir audios em HTML5.
  </p>
<audio preload="metadata" autoplay controls>
   <source src="audio/ValeuNatalina.mp3" type="audio/mpeg ">
     <source src="audio/ValeuNatalina.mp3" type="audio/ogg ">
      <source src="audio/ValeuNatalina.mp3" type="audio/wav ">
       <p>
        Infelizmente seu navegador não consegue reproduzir áudio.
        <a href="audio/ValeuNatalina.mp3">Clique aqui para baixar o arquivo MP3</a>
       </p>
</audio>
<a
href="audio/ValeuNatalina.mp3" download="audio/ValeuNatalina.mp3" type="audio/mpeg">clique aqui para baixar o arquivo MP3
</a>

</body>
</html>
