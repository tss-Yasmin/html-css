<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatação de Textos</title>
</head>
<body>
  <h1>principais formatações</h1>
  <h2>destaque</h2>
  <p>
    nesta frase, tenho um <strong>termo em destaque</strong> usando a tag STRONG (semântica)
  </p>
  <h2>Italíco / enfase</h2>
  <p>
    nesta frase, <em>temos um termo de enfase</em> a tag EM (semantica).
  </p>
  <p>
    podemos criar também <mark style="background-color: rgb(120, 83, 155);">um texto marcado</mark> usando a tag MARK <!--dentro da tag-style-->
  </p>
  
</body>
</html>
