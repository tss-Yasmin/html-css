<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>links</title>
  <style>
      /*
      # = id
      . = class
      : = pseudo-class
      :: = pseudo-element
      > = children
      */

    a {
      color: red;
      text-decoration: none;
      font-weight: bold;
    }

    a:visited {
      color: darkred;
    } /*link visitado*/

    a:hover {
      color: black;
      text-decoration: underline;
    }
    /*passar o mouse*/
    a:active {
      color: palevioletred;
    }
    /*ao pressionar click*/
    
  </style>
</head>
<body>
  <h1>Personalizando links</h1>
  <ul>
    <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositorio GitHub</a></li>
    <li><a href="https://youtube.com?cursoemvideo/" target="_blank">Canal do YouTube</a></li>
    <li><a href="https://www.cursoemvideo.com?cursoemvideo" target="_blank">Site do Curso em Video</a></li>
  </ul>
</body>
</html>
/*target blank-abir pag em nova aba*/
