<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabelas</title>
  <style>
    table {
      width: 400px;
      height: 400px;
      border-collapse: collapse;
    }

    tr {
      background-color: rgba(0, 0, 0, 0.116);
    }

    td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
      vertical-align: middle;
    }

    .c2 {
      text-align: right;
    }

    .a2 {
      text-align: left;
    }

    .b1 {
      vertical-align: top;
    }

    .b3 {
      vertical-align: bottom;
    }
  </style>
</head>
<body>
  <h1>
    Minha primeira tabela
  </h1>
  <table>
    <tr>
      <td>a1</td>
      <td class="b1">b1</td>
      <td>c1</td>
    </tr>
    <tr>
      <td class="a2">a2</td>
      <td>b2</td>
      <td class="c2">c2</td>
    </tr>
    <tr>
      <td>a3</td>
      <td class="b3">b3</td>
      <td>c3</td>
    </tr>
  </table>
</body>
</html>
